name: Refresh candidaturas first fold
on:
  push:
    paths:
      - '.github/scripts/refresh_first_fold.py'
      - '.github/workflows/refresh-candidaturas-first-fold.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/refresh_first_fold.py
      - name: Commit changes and cleanup
        run: |
          rm .github/scripts/refresh_first_fold.py
          rm .github/workflows/refresh-candidaturas-first-fold.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidaturas/index.html .github/scripts/refresh_first_fold.py .github/workflows/refresh-candidaturas-first-fold.yml
          git commit -m "Refina primeira rolagem da página de candidaturas"
          git push
