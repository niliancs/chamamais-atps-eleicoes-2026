name: Implement brand signatures v2
on:
  push:
    branches: [brand-signatures-implementation]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct canonical assets and implement map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .brand-tmp/megafone-gz.part* | base64 -d | gzip -d > assets/megafone_mao.svg
          python - <<'PY'
          from pathlib import Path
          import hashlib, xml.etree.ElementTree as ET
          for f in ['assets/lettering_chama_atps.svg','assets/pincelada_azul_preset.svg']:
              b=Path(f).read_bytes()
              if b.endswith(b'\n'):
                  Path(f).write_bytes(b[:-1])
          expected={
            'assets/lettering_chama_atps.svg':'66260e15f948fb96143a4315aa2a01ed722f2aa31670ba4aaf301f666af344fa',
            'assets/megafone_mao.svg':'f8ecb5989158d39c07b3b6dfe007f20c1bee7f6e9124dbc5e35ac56bc4ad14e7',
            'assets/pincelada_azul_preset.svg':'1cade3431f9d0b2dc51a0bacd4c47cebf8c8a1a3414c37385d88da87fb4284be',
          }
          dims={
            'assets/lettering_chama_atps.svg':('454.055365pt','251.508016pt'),
            'assets/megafone_mao.svg':('1080','1350'),
            'assets/pincelada_azul_preset.svg':('1080.000000pt','1350.000000pt'),
          }
          for f,h in expected.items():
              b=Path(f).read_bytes(); got=hashlib.sha256(b).hexdigest(); assert got==h,(f,got)
              text=b.decode(); root=ET.fromstring(text)
              assert (root.attrib.get('width'),root.attrib.get('height'))==dims[f]
              assert '<rect' not in text.lower()
          print('ASSET QA PASS — hashes, dimensões vetoriais e fundo transparente verificados')
          PY
          cat > assets/brand.css <<'CSS'
          .brand-signature{position:relative;display:block;flex:0 0 auto;max-width:100%;line-height:0;isolation:isolate}
          .brand-signature img,.brand-icon img{display:block;max-width:none!important;height:auto}
          .brand-brush-crop,.brand-megaphone-crop{position:absolute;display:block;overflow:hidden}
          .brand-brush-crop img{position:absolute;width:121.4848%;left:-11.0236%;top:-136.1878%}
          .brand-megaphone-crop img{position:absolute;width:223.1405%;left:-56.6116%;top:-203.1128%}
          .brand-signature .brand-lettering{position:absolute;z-index:2}
          .brand-signature--brush{width:clamp(150px,19vw,220px);aspect-ratio:220/132}
          .brand-signature--brush .brand-brush-crop{width:100%;left:0;top:25.76%;aspect-ratio:889/362;z-index:1}
          .brand-signature--brush .brand-lettering{width:88%;left:5.5%;top:16.67%}
          .brand-signature--megaphone{width:clamp(175px,22vw,240px);aspect-ratio:273/132}
          .brand-signature--megaphone .brand-brush-crop{width:80.586%;left:0;top:25.76%;aspect-ratio:889/362;z-index:1}
          .brand-signature--megaphone .brand-lettering{width:70.916%;left:4.43%;top:16.67%}
          .brand-signature--megaphone .brand-megaphone-crop{width:43.516%;left:56.41%;top:5.3%;aspect-ratio:484/257;z-index:3}
          .brand-signature--hero{margin:0 0 1rem}.brand-signature--small{width:clamp(108px,12vw,138px)}.brand-signature--footer{margin:0 0 .85rem}
          .brand-icon{position:relative;display:inline-block;flex:0 0 auto;vertical-align:middle;line-height:0}
          .brand-icon--megaphone{width:clamp(30px,3.2vw,36px);aspect-ratio:484/257}.brand-icon--megaphone .brand-megaphone-crop{inset:0}
          .brand-heading-accent{display:flex;align-items:center;gap:.75rem}.brand-heading-accent>:last-child{margin:0}
          @media(max-width:620px){.brand-signature--brush{width:clamp(148px,45vw,175px)}.brand-signature--megaphone{width:clamp(165px,54vw,190px)}.brand-signature--small{width:108px}.brand-signature--hero{margin-bottom:.8rem}.brand-heading-accent{gap:.6rem}}
          @media print{.brand-signature,.brand-icon{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
          CSS
          python - <<'PY'
          from pathlib import Path
          BR='''<div class="brand-signature brand-signature--brush brand-signature--hero" role="img" aria-label="Chama + ATPS"><span class="brand-brush-crop" aria-hidden="true"><img src="{P}assets/pincelada_azul_preset.svg" alt=""></span><img class="brand-lettering" src="{P}assets/lettering_chama_atps.svg" alt="" aria-hidden="true"></div>'''
          ME='''<div class="brand-signature brand-signature--megaphone brand-signature--hero" role="img" aria-label="Chama + ATPS"><span class="brand-brush-crop" aria-hidden="true"><img src="../assets/pincelada_azul_preset.svg" alt=""></span><img class="brand-lettering" src="../assets/lettering_chama_atps.svg" alt="" aria-hidden="true"><span class="brand-megaphone-crop" aria-hidden="true"><img src="../assets/megafone_mao.svg" alt=""></span></div>'''
          FT='''<div class="brand-signature brand-signature--brush brand-signature--small brand-signature--footer" aria-hidden="true"><span class="brand-brush-crop"><img src="{P}assets/pincelada_azul_preset.svg" alt=""></span><img class="brand-lettering" src="{P}assets/lettering_chama_atps.svg" alt=""></div>'''
          IC='''<span class="brand-icon brand-icon--megaphone" aria-hidden="true"><span class="brand-megaphone-crop"><img src="assets/megafone_mao.svg" alt=""></span></span>'''
          def load(p): return Path(p).read_text(encoding='utf-8')
          def save(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,a,b,label):
              n=s.count(a)
              if n!=1: raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              return s.replace(a,b,1)
          def link(s,href,label):
              return s if href in s else once(s,'</head>',f'<link rel="stylesheet" href="{href}">\n</head>',label)
          s=load('index.html'); s=link(s,'assets/brand.css','home css'); br=BR.format(P=''); ft=FT.format(P='')
          s=once(s,'<p class="eyebrow">Eleições 2026</p>',br+'\n      <p class="eyebrow">Eleições 2026</p>','home hero')
          h='<h2 id="nota-titulo" class="nota-heading">Nota de esclarecimento</h2>'; s=once(s,h,'<div class="brand-heading-accent">'+IC+h+'</div>','home note')
          s=once(s,'<footer class="lp-footer">\n    <div class="inner">','<footer class="lp-footer">\n    <div class="inner">\n      '+ft,'home footer'); save('index.html',s)
          s=load('apoio-lula/index.html'); s=link(s,'../assets/brand.css','apoio css'); s=once(s,'<header class="hero">','<header class="hero">'+ME,'apoio hero'); save('apoio-lula/index.html',s)
          br=BR.format(P='../'); ft=FT.format(P='../')
          s=load('fundamentos/index.html'); s=link(s,'../assets/brand.css','fund css'); s=once(s,'<header class="report-head">','<header class="report-head">'+br,'fund hero'); s=once(s,'<footer class="foot">','<footer class="foot">'+ft,'fund footer'); save('fundamentos/index.html',s)
          s=load('candidaturas/index.html'); s=link(s,'../assets/brand.css','cand css'); m='<section class="hero"><div class="wrap hero-inner"><div>'; s=once(s,m,m+br,'cand hero'); s=once(s,'<footer><div class="wrap tail">','<footer><div class="wrap tail">'+ft,'cand footer'); save('candidaturas/index.html',s)
          PY
      - name: QA and commit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          f={p:Path(p).read_text(encoding='utf-8') for p in ['index.html','apoio-lula/index.html','fundamentos/index.html','candidaturas/index.html']}
          checks=[
            (f['index.html'].count('brand-signature--brush')==2,'Home brush x2'),
            (f['index.html'].count('brand-icon--megaphone')==1,'Home megafone x1'),
            (f['apoio-lula/index.html'].count('brand-signature--megaphone')==1,'Apoio lockup megafone x1'),
            (f['fundamentos/index.html'].count('brand-signature--brush')==2,'Fundamentos brush x2'),
            (f['candidaturas/index.html'].count('brand-signature--brush')==2,'Candidaturas brush x2'),
            (f['candidaturas/index.html'].count('brand-icon--megaphone')==0,'Candidaturas sem megafone'),
          ]
          for ok,msg in checks:
              assert ok,msg; print('PASS',msg)
          panel=f['candidaturas/index.html'].split('<main class="wrap" id="conteudo">',1)[1].split('</main>',1)[0]
          assert 'brand-signature' not in panel
          print('QA PASS — mapa de marca aplicado sem invadir o painel')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/brand.css assets/megafone_mao.svg assets/lettering_chama_atps.svg assets/pincelada_azul_preset.svg index.html apoio-lula/index.html fundamentos/index.html candidaturas/index.html
          git commit -m 'Implement canonical brand signatures across microsite'
          git push
