name: Fix P2 copy
on: [push]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sed -i 's/por manifestar apoio à candidatura de Lula/manifestar apoio à candidatura de Lula/g' index.html
          sed -i 's/Mais 1 documentos/Mais 1 documento/g' candidaturas/index.html
          sed -i 's/Coautor(a) \/ signatário(a) eletrônico(a)/Coautoria\/signatura eletrônica/g' candidaturas/index.html
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html candidaturas/index.html
          git commit -m 'Fix P2 copy' || exit 0
          git push
