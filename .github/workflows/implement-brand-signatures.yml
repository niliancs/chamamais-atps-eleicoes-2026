name: Implement brand signatures
on:
  push:
    branches: [brand-signatures-implementation]
permissions:
  contents: write
jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and verify canonical assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat .brand-tmp/megafone-gz.part* | base64 -d | gzip -d > assets/megafone_mao.svg
          echo "66260e15f948fb96143a4315aa2a01ed722f2aa31670ba4aaf301f666af344fa  assets/lettering_chama_atps.svg" | sha256sum -c -
          echo "f8ecb5989158d39c07b3b6dfe007f20c1bee7f6e9124dbc5e35ac56bc4ad14e7  assets/megafone_mao.svg" | sha256sum -c -
          echo "1cade3431f9d0b2dc51a0bacd4c47cebf8c8a1a3414c37385d88da87fb4284be  assets/pincelada_azul_preset.svg" | sha256sum -c -
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          checks = {
              'assets/lettering_chama_atps.svg': ('454.055365pt','251.508016pt'),
              'assets/megafone_mao.svg': ('1080','1350'),
              'assets/pincelada_azul_preset.svg': ('1080.000000pt','1350.000000pt'),
          }
          for f, dims in checks.items():
              text=Path(f).read_text(encoding='utf-8')
              root=ET.fromstring(text)
              assert root.attrib.get('width') == dims[0], (f, root.attrib.get('width'))
              assert root.attrib.get('height') == dims[1], (f, root.attrib.get('height'))
              assert '<rect' not in text.lower(), f'{f}: unexpected background rect'
          print('ASSET QA PASS — vetoriais, fundo sem retângulo e dimensões canônicas verificadas')
          PY
      - name: Create shared responsive brand styles
        shell: bash
        run: |
          cat > assets/brand.css <<'CSS'
          /* Chama + ATPS · sistema de assinaturas canônicas */
          .brand-signature{position:relative;display:block;flex:0 0 auto;max-width:100%;line-height:0;isolation:isolate}
          .brand-signature img,.brand-icon img{display:block;max-width:none!important;height:auto}
          .brand-brush-crop,.brand-megaphone-crop{position:absolute;display:block;overflow:hidden}
          .brand-brush-crop img{position:absolute;width:121.4848%;left:-11.0236%;top:-136.1878%}
          .brand-megaphone-crop img{position:absolute;width:223.1405%;left:-56.6116%;top:-203.1128%}
          .brand-signature .brand-lettering{position:absolute;z-index:2}
          .brand-signature--brush{width:clamp(150px,19vw,220px);aspect-ratio:220/132}
          .brand-signature--brush .brand-brush-crop{width:100%;left:0;top:25.76%;aspect-ratio:889/362;z-index:1}
          .brand-signature--brush .brand-lettering{width:88%;left:5.5%;top:16.67%}
          .brand-signature--megaphone{width:clamp(175px,22vw,240px);aspect-ratio:273/132}
          .brand-signature--megaphone .brand-brush-crop{width:80.586%;left:0;top:25.76%;aspect-ratio:889/362;z-index:1}
          .brand-signature--megaphone .brand-lettering{width:70.916%;left:4.43%;top:16.67%}
          .brand-signature--megaphone .brand-megaphone-crop{width:43.516%;left:56.41%;top:5.3%;aspect-ratio:484/257;z-index:3}
          .brand-signature--hero{margin:0 0 1rem}
          .brand-signature--small{width:clamp(108px,12vw,138px)}
          .brand-signature--footer{margin:0 0 .85rem}
          .brand-icon{position:relative;display:inline-block;flex:0 0 auto;vertical-align:middle;line-height:0}
          .brand-icon--megaphone{width:clamp(30px,3.2vw,36px);aspect-ratio:484/257}
          .brand-icon--megaphone .brand-megaphone-crop{inset:0}
          .brand-heading-accent{display:flex;align-items:center;gap:.75rem}
          .brand-heading-accent>:last-child{margin:0}
          @media(max-width:620px){
            .brand-signature--brush{width:clamp(148px,45vw,175px)}
            .brand-signature--megaphone{width:clamp(165px,54vw,190px)}
            .brand-signature--small{width:108px}
            .brand-signature--hero{margin-bottom:.8rem}
            .brand-heading-accent{gap:.6rem}
          }
          @media print{.brand-signature,.brand-icon{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
          CSS
      - name: Place signatures by editorial function
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          BRUSH_ROOT='''<div class="brand-signature brand-signature--brush brand-signature--hero" role="img" aria-label="Chama + ATPS"><span class="brand-brush-crop" aria-hidden="true"><img src="assets/pincelada_azul_preset.svg" alt=""></span><img class="brand-lettering" src="assets/lettering_chama_atps.svg" alt="" aria-hidden="true"></div>'''
          BRUSH_SUB='''<div class="brand-signature brand-signature--brush brand-signature--hero" role="img" aria-label="Chama + ATPS"><span class="brand-brush-crop" aria-hidden="true"><img src="../assets/pincelada_azul_preset.svg" alt=""></span><img class="brand-lettering" src="../assets/lettering_chama_atps.svg" alt="" aria-hidden="true"></div>'''
          MEGA_SUB='''<div class="brand-signature brand-signature--megaphone brand-signature--hero" role="img" aria-label="Chama + ATPS"><span class="brand-brush-crop" aria-hidden="true"><img src="../assets/pincelada_azul_preset.svg" alt=""></span><img class="brand-lettering" src="../assets/lettering_chama_atps.svg" alt="" aria-hidden="true"><span class="brand-megaphone-crop" aria-hidden="true"><img src="../assets/megafone_mao.svg" alt=""></span></div>'''
          FOOT_ROOT='''<div class="brand-signature brand-signature--brush brand-signature--small brand-signature--footer" aria-hidden="true"><span class="brand-brush-crop"><img src="assets/pincelada_azul_preset.svg" alt=""></span><img class="brand-lettering" src="assets/lettering_chama_atps.svg" alt=""></div>'''
          FOOT_SUB='''<div class="brand-signature brand-signature--brush brand-signature--small brand-signature--footer" aria-hidden="true"><span class="brand-brush-crop"><img src="../assets/pincelada_azul_preset.svg" alt=""></span><img class="brand-lettering" src="../assets/lettering_chama_atps.svg" alt=""></div>'''
          ICON_ROOT='''<span class="brand-icon brand-icon--megaphone" aria-hidden="true"><span class="brand-megaphone-crop"><img src="assets/megafone_mao.svg" alt=""></span></span>'''

          def load(p): return Path(p).read_text(encoding='utf-8')
          def save(p,s): Path(p).write_text(s,encoding='utf-8')
          def once(s,old,new,label):
              n=s.count(old)
              if n!=1: raise SystemExit(f'{label}: expected 1 occurrence, found {n}')
              return s.replace(old,new,1)
          def css_link(s,href,label):
              if href in s: return s
              return once(s,'</head>',f'<link rel="stylesheet" href="{href}">\n</head>',label)

          p='index.html'; s=load(p); s=css_link(s,'assets/brand.css','home css')
          s=once(s,'<p class="eyebrow">Eleições 2026</p>',BRUSH_ROOT+'\n      <p class="eyebrow">Eleições 2026</p>','home hero')
          old='<h2 id="nota-titulo" class="nota-heading">Nota de esclarecimento</h2>'
          s=once(s,old,'<div class="brand-heading-accent">'+ICON_ROOT+old+'</div>','home note')
          s=once(s,'<footer class="lp-footer">\n    <div class="inner">','<footer class="lp-footer">\n    <div class="inner">\n      '+FOOT_ROOT,'home footer')
          save(p,s)

          p='apoio-lula/index.html'; s=load(p); s=css_link(s,'../assets/brand.css','apoio css')
          s=once(s,'<header class="hero">','<header class="hero">'+MEGA_SUB,'apoio hero')
          save(p,s)

          p='fundamentos/index.html'; s=load(p); s=css_link(s,'../assets/brand.css','fundamentos css')
          s=once(s,'<header class="report-head">','<header class="report-head">'+BRUSH_SUB,'fundamentos hero')
          s=once(s,'<footer class="foot">','<footer class="foot">'+FOOT_SUB,'fundamentos footer')
          save(p,s)

          p='candidaturas/index.html'; s=load(p); s=css_link(s,'../assets/brand.css','candidaturas css')
          marker='<section class="hero"><div class="wrap hero-inner"><div>'
          s=once(s,marker,marker+BRUSH_SUB,'candidaturas hero')
          s=once(s,'<footer><div class="wrap tail">','<footer><div class="wrap tail">'+FOOT_SUB,'candidaturas footer')
          save(p,s)
          PY
      - name: Brand regression QA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          f={p:Path(p).read_text(encoding='utf-8') for p in ['index.html','apoio-lula/index.html','fundamentos/index.html','candidaturas/index.html']}
          def ok(x,msg):
              if not x: raise SystemExit('QA FAIL: '+msg)
              print('PASS',msg)
          ok(f['index.html'].count('brand-signature--brush')==2,'Home: hero + footer com pincelada')
          ok(f['index.html'].count('brand-icon--megaphone')==1,'Home: 1 megafone na nota')
          ok(f['apoio-lula/index.html'].count('brand-signature--megaphone')==1,'Por que Lula: 1 assinatura com megafone')
          ok(f['fundamentos/index.html'].count('brand-signature--brush')==2,'Fundamentos: hero + footer com pincelada')
          ok(f['candidaturas/index.html'].count('brand-signature--brush')==2,'Candidaturas: hero + footer com pincelada')
          ok(f['candidaturas/index.html'].count('brand-icon--megaphone')==0,'Candidaturas: sem megafone no painel')
          for p in f:
              href='assets/brand.css' if p=='index.html' else '../assets/brand.css'
              ok(href in f[p],p+': carrega brand.css')
          ok('brand-signature' not in f['candidaturas/index.html'].split('<main class="wrap" id="conteudo">',1)[1].split('</main>',1)[0],'Candidaturas: nenhuma assinatura dentro do conteúdo do painel')
          print('QA PASS — implementação editorial e responsiva consistente')
          PY
      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add assets/brand.css assets/megafone_mao.svg index.html apoio-lula/index.html fundamentos/index.html candidaturas/index.html
          git commit -m 'Implement canonical brand signatures across microsite'
          git push
