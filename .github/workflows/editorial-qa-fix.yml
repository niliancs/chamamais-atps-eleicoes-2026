name: Editorial QA fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply editorial fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def sub(path, old, new, expected=1, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              found = text.count(old)
              if expected is not None and found != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {found}: {old[:90]!r}')
              text = text.replace(old, new, count if count is not None else -1)
              p.write_text(text, encoding='utf-8')

          # LANDING — precisão do recorte, representatividade, documentos e data.
          sub(
              'index.html',
              '''        após análise dos planos de governo dos dois candidatos mais bem colocados no cenário eleitoral
        consultado, manifestar apoio público à candidatura de Lula à Presidência da República e divulgar''',
              '''        após análise dos planos de governo de Lula e Flávio Bolsonaro, tomados como referência no cenário
        eleitoral considerado pela Comissão, manifestar apoio público à candidatura de Lula à Presidência da República e divulgar'''
          )
          sub(
              'index.html',
              'Os resultados registram a manifestação das pessoas que participaram voluntariamente e reforçam a legitimidade da decisão da Comissão, sem pressupor unanimidade ou representatividade estatística de todo o Cadastro Reserva.',
              'Os resultados registram a manifestação das pessoas que participaram voluntariamente e reforçam a legitimidade do posicionamento da Comissão, sem pressupor unanimidade ou representatividade estatística de todo o Cadastro Reserva.'
          )
          sub(
              'index.html',
              '''            <p>O posicionamento é da Comissão do Cadastro Reserva de ATPS do CPNU 1, no âmbito do movimento #ChamaMaisATPS. A consulta posterior reforça sua legitimidade entre as pessoas que participaram, mas não transforma essa posição em manifestação institucional de todo o Cadastro Reserva, de toda a carreira de ATPS, do MGI ou da Andeps, nem substitui as escolhas políticas individuais de seus integrantes.</p>
            <p>Os percentuais divulgados referem-se exclusivamente às pessoas que participaram voluntariamente das consultas e não pressupõem unanimidade nem representatividade estatística de todo o Cadastro Reserva.</p>''',
              '''            <p>O posicionamento é da Comissão do Cadastro Reserva de ATPS do CPNU 1, no âmbito do movimento #ChamaMaisATPS. A consulta posterior reforça sua legitimidade entre as pessoas que participaram, sem transformá-lo em manifestação institucional de todo o Cadastro Reserva, de toda a carreira de ATPS, do MGI ou da Andeps, nem substituir as escolhas políticas individuais de seus integrantes. Os percentuais divulgados referem-se exclusivamente às pessoas que participaram voluntariamente das consultas e não pressupõem unanimidade nem representatividade estatística de todo o Cadastro Reserva.</p>'''
          )
          sub('index.html', '<h3>Plano de Governo Lula 2026</h3>', '<h3>Programa de Governo — Lula · Eleições 2026</h3>')
          sub('index.html', '<p class="doc-meta">PDF · fonte primária</p>', '<p class="doc-meta">PDF para consulta · documento da candidatura · origem: TSE Dados Abertos</p>', expected=2)
          sub('index.html', '<h3>Plano de Governo Flávio Bolsonaro 2026</h3>', '<h3>Diretrizes do Plano de Governo 2027–2030 — Flávio Bolsonaro</h3>')
          sub('index.html', 'Versão pública atualizada em 12/09/2026 · Conteúdo sujeito a atualização quando houver nova evidência documentada.', 'Última atualização: 13/09/2026 · Conteúdo sujeito a atualização quando houver nova evidência documentada.')

          # POR QUE LULA — microcopy e acesso direto aos PDFs usados na análise.
          sub('apoio-lula/index.html', 'Bolsa Família retomado com piso de R$ 600', 'O Bolsa Família foi retomado com piso de R$ 600', expected=1)
          sub('apoio-lula/index.html', 'Defendemos capacidade técnica, continuidade dos serviços e controle público sobre suas prioridades.', 'Defendemos capacidade técnica, continuidade dos serviços e controle público sobre as prioridades do Estado.', expected=1)
          old_ref = '''</table></div><span class="refs"><a href="https://dadosabertos.tse.jus.br/dataset/candidatos-2026/resource/433ac1f4-07dc-44a2-bcbe-c87a2073721a" target="_blank" rel="noopener noreferrer">TSE — pacote oficial de propostas presidenciais 2026 (contém os PDFs auditados de Lula e Flávio Bolsonaro)</a></span>'''
          new_ref = '''</table></div><span class="refs"><a href="https://dadosabertos.tse.jus.br/dataset/candidatos-2026/resource/433ac1f4-07dc-44a2-bcbe-c87a2073721a" target="_blank" rel="noopener noreferrer">TSE — pacote oficial de propostas presidenciais 2026 (contém os PDFs auditados de Lula e Flávio Bolsonaro)</a> · <a href="https://drive.google.com/file/d/1ruX45Z09uhSPNebIKXBvZ5qLYfPJKNKO/view" target="_blank" rel="noopener noreferrer">Abrir PDF utilizado nesta análise — Lula</a> · <a href="https://drive.google.com/file/d/12qZqODh8K7D4fxEDQ0zt2F8Hby7-0Prv/view" target="_blank" rel="noopener noreferrer">Abrir PDF utilizado nesta análise — Flávio Bolsonaro</a></span>'''
          sub('apoio-lula/index.html', old_ref, new_ref, expected=1)

          # FUNDAMENTOS — duas consultas explicitadas, gramática e PDFs diretamente legíveis.
          sub(
              'fundamentos/index.html',
              '''<p>A Comissão do Cadastro Reserva de ATPS do CPNU 1 deliberou o apoio público à candidatura de Lula em 09/09/2026. Depois da deliberação, o posicionamento foi submetido a consulta voluntária de 24 horas no grupo “Mobilização pelo CF3 – CR ATPS”, formado por pessoas que permanecem no Cadastro Reserva.</p><p><strong>95,1% dos participantes foram favoráveis</strong> ao apoio público a Lula. Em consulta separada, <strong>90,3% dos participantes foram favoráveis</strong> à divulgação de candidaturas parlamentares selecionadas segundo critérios públicos e verificáveis.</p>''',
              '''<p>A Comissão do Cadastro Reserva de ATPS do CPNU 1 deliberou o apoio público à candidatura de Lula em 09/09/2026. Depois da deliberação, foram realizadas duas consultas voluntárias de 24 horas no grupo “Mobilização pelo CF3 – CR ATPS”, formado por pessoas que permanecem no Cadastro Reserva: uma sobre o apoio público a Lula e outra sobre a divulgação de candidaturas parlamentares segundo critérios públicos e verificáveis.</p><p>Na primeira consulta, <strong>95,1% dos participantes foram favoráveis</strong> ao apoio público a Lula. Na segunda, <strong>90,3% dos participantes foram favoráveis</strong> à divulgação de candidaturas parlamentares selecionadas segundo critérios públicos e verificáveis.</p>''',
              expected=1
          )
          sub('fundamentos/index.html', 'Bolsa Família retomado com piso de R$ 600', 'O Bolsa Família foi retomado com piso de R$ 600', expected=1)
          sub('fundamentos/index.html', old_ref, new_ref, expected=1)

          # CANDIDATURAS — apenas a precisão sobre cadastro de reserva; manter o recorte editorial como está.
          sub(
              'candidaturas/index.html',
              'O cadastro de reserva reúne pessoas aprovadas que aguardam convocação.',
              'O cadastro de reserva reúne pessoas aprovadas e classificadas que ainda não foram convocadas.',
              expected=1
          )
          PY

      - name: Editorial QA checks
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'planos de governo de Lula e Flávio Bolsonaro' index.html
          grep -q 'legitimidade do posicionamento da Comissão' index.html
          grep -q 'Programa de Governo — Lula · Eleições 2026' index.html
          grep -q 'Diretrizes do Plano de Governo 2027–2030 — Flávio Bolsonaro' index.html
          grep -q 'Última atualização: 13/09/2026' index.html
          grep -q 'foram realizadas duas consultas voluntárias' fundamentos/index.html
          grep -q 'O Bolsa Família foi retomado com piso de R\$ 600' apoio-lula/index.html
          grep -q 'O Bolsa Família foi retomado com piso de R\$ 600' fundamentos/index.html
          grep -q 'controle público sobre as prioridades do Estado' apoio-lula/index.html
          grep -q 'Abrir PDF utilizado nesta análise — Lula' apoio-lula/index.html
          grep -q 'Abrir PDF utilizado nesta análise — Flávio Bolsonaro' fundamentos/index.html
          grep -q 'pessoas aprovadas e classificadas que ainda não foram convocadas' candidaturas/index.html
          grep -q 'candidaturas de esquerda e centro-esquerda' candidaturas/index.html
          ! grep -q 'Versão pública atualizada em 12/09/2026' index.html
          ! grep -q 'Bolsa Família retomado com piso de R\$ 600' apoio-lula/index.html

      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/editorial-qa-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apoio-lula/index.html fundamentos/index.html candidaturas/index.html .github/workflows/editorial-qa-fix.yml
          git commit -m 'Ajusta QA editorial do microsite'
          git push