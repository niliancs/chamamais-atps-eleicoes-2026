name: Clean public version labels

on:
  push:
    paths:
      - '.github/workflows/clean-public-version-labels.yml'

permissions:
  contents: write

jobs:
  clean-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Remove internal release language from public candidaturas page
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('candidaturas/index.html')
          s = p.read_text(encoding='utf-8')

          replacements = {
              'exercício atual não rechecado individualmente na v4.6': 'exercício atual não rechecado individualmente neste levantamento',
              'Centro-esquerda é incluída explicitamente na v4.6.': 'O recorte inclui candidaturas de esquerda e centro-esquerda.',
              'Na v4.6, a EMP 48/2025 acrescenta ação formal sobre a carreira de ATPS.': 'A EMP 48/2025 acrescenta ação formal sobre a carreira de ATPS.',
              'a v4.6 acrescenta as subscrições dos REQ 18 e 29/2025 e a EMP 48/2025 sobre a carreira.': 'também foram incorporadas as subscrições dos REQ 18 e 29/2025 e a EMP 48/2025 sobre a carreira.',
              'Incluído no recorte ampliado da v4.6.': 'Incluído no recorte de esquerda e centro-esquerda.',
              'Escopo desta edição:': 'Escopo do painel:',
              'documentação de versões anteriores': 'documentação de apoio do levantamento',
              'nesta edição.': 'neste levantamento.',
              'desta edição.': 'deste recorte.',
              'Não houve abertura de uma nova pesquisa nacional nesta versão.': 'A seleção parte dos nomes previamente pesquisados e das inclusões documentadas.',
              'Corte factual: 10/09/2026 · v4.6 · correção funcional e QA: 11/09/2026.': 'Corte factual: 10/09/2026 · atualização: 11/09/2026.',
              '"version":"4.6",': '',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Frase-alvo não encontrada: {old}')
              s = s.replace(old, new)

          old_delta = '<details class="delta-v46"><summary>Delta v4.6 sobre a v4.5</summary><p>Esta versão não reabre a pesquisa nacional nem muda a arquitetura do painel. O delta incorpora a EMP 48/2025, evidências adicionais da Câmara, correções de categoria em fichas já existentes e candidaturas novas de esquerda e centro-esquerda vinculadas por ato formal. Nenhuma candidatura da v4.5 foi removida.</p><p>Assinar a EMP 48/2025 comprova ação formal sobre a carreira de ATPS, mas não é tratado como prova automática de apoio ao cadastro de reserva, ao CF3 ou ao pedido +500.</p></details>'
          new_delta = '<details><summary>O que foi incorporado nesta atualização</summary><p>Esta atualização incorpora a EMP 48/2025, evidências adicionais da Câmara, correções de categoria em fichas já existentes e candidaturas novas de esquerda e centro-esquerda vinculadas por ato formal.</p><p>Assinar a EMP 48/2025 comprova ação formal sobre a carreira de ATPS, mas não é tratado como prova automática de apoio ao cadastro de reserva, ao CF3 ou ao pedido +500.</p></details>'
          if s.count(old_delta) != 1:
              raise SystemExit(f'Bloco delta esperado 1 vez; encontrado {s.count(old_delta)}')
          s = s.replace(old_delta, new_delta, 1)

          updates = re.compile(r'<details><summary>Atualizações desta edição</summary>.*?</details>(?=</section></main>)', re.S)
          if len(updates.findall(s)) != 1:
              raise SystemExit('Bloco histórico de versões não localizado de forma única')
          new_updates = '<details><summary>Atualizações do levantamento</summary><p><b>Atualização de 11/09/2026.</b> O painel reúne 69 candidaturas e incorporou novas evidências legislativas, correções de categoria e candidaturas pertinentes de esquerda e centro-esquerda. A exibição das fichas, a busca, os filtros e as contagens foram revalidados.</p><p>Também foi incorporada documentação que confirma o pedido de Renato Roseno para realização do CF3: Ofício 66/2026/GABRR, de 09/04/2026, identificado na resposta do MGI de 12/06/2026, além da Nota Informativa 18172/2026/MGI.</p><p>Foram mantidas as correções documentais já consolidadas, incluindo as leis 11.307/2026 e 11.302/2026 de coautoria de Carlos Minc; a distinção entre emendas de tecnologia da informação e atos sobre ATPS; e a separação entre propostas apresentadas, atos formais e resultados efetivamente confirmados.</p></details>'
          s = updates.sub(new_updates, s, count=1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Public-copy and link regression QA
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re, posixpath

          files = [Path('index.html'), Path('apoio-lula/index.html'), Path('fundamentos/index.html'), Path('candidaturas/index.html')]

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]; self.ids=set(); self.visible=[]; self.skip=0
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if d.get('id'): self.ids.add(d['id'])
                  if tag=='a' and d.get('href') is not None: self.links.append(d)
                  if tag in ('script','style'): self.skip += 1
              def handle_endtag(self, tag):
                  if tag in ('script','style') and self.skip: self.skip -= 1
              def handle_data(self, data):
                  if not self.skip: self.visible.append(data)

          parsed={}
          errors=[]
          for p in files:
              x=Parser(); x.feed(p.read_text(encoding='utf-8')); parsed[p]=x

          cand=parsed[Path('candidaturas/index.html')]
          visible=' '.join(' '.join(t.split()) for t in cand.visible)
          forbidden_visible=[r'v4\.\d', r'Versão\s+4', r'Delta\s+v4', r'patch funcional', r'correção funcional', r'\bQA\b']
          for pat in forbidden_visible:
              if re.search(pat, visible, re.I): errors.append(f'Linguagem interna ainda visível: {pat}')

          source=Path('candidaturas/index.html').read_text(encoding='utf-8')
          required=['O que foi incorporado nesta atualização','Atualizações do levantamento','Corte factual: 10/09/2026 · atualização: 11/09/2026.']
          for token in required:
              if token not in source: errors.append(f'Texto público esperado ausente: {token}')

          for p,x in parsed.items():
              for a in x.links:
                  href=a['href']
                  if ' ' in href: errors.append(f'{p}: espaço literal em href: {href}')
                  if a.get('target')=='_blank':
                      rel=set((a.get('rel') or '').split())
                      if not {'noopener','noreferrer'}.issubset(rel): errors.append(f'{p}: target=_blank sem noopener+noreferrer: {href}')
                  parts=urlsplit(href)
                  if parts.scheme in ('http','https','mailto','tel','javascript','data'): continue
                  if not parts.path: target=p
                  else:
                      target=Path(posixpath.normpath(posixpath.join(p.parent.as_posix(),parts.path)))
                      if href.split('#',1)[0].split('?',1)[0].endswith('/'): target=target/'index.html'
                      if not target.exists(): errors.append(f'{p}: link interno sem destino: {href}')
                      else:
                          if parts.fragment and target in parsed and parts.fragment not in parsed[target].ids: errors.append(f'{p}: âncora inexistente: {href}')

          if errors:
              raise SystemExit('\n'.join(errors))
          print('PASS: sem linguagem interna de versão visível e sem regressão estrutural de links.')
          PY

      - name: Regenerate checksums
        run: |
          sha256sum index.html apoio-lula/index.html fundamentos/index.html candidaturas/index.html assets/styles.css README_RELEASE.md CHANGELOG.md QA_REPORT_FINAL.md > SHA256SUMS.txt

      - name: Commit cleanup
        run: |
          git config user.name 'Nílian Silva'
          git config user.email 'niliancs@gmail.com'
          git add candidaturas/index.html SHA256SUMS.txt
          git commit -m 'Clean internal version language from public candidaturas page'
          git push origin main
