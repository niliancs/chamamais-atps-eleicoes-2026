name: Final terminology and links QA
on:
  push:
    paths:
      - '.github/workflows/final-terminology-links-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ajustar terminologia pública
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_all(path, pairs):
              p = Path(path)
              s = p.read_text(encoding='utf-8')
              before = s
              for old, new in pairs:
                  s = s.replace(old, new)
              if s != before:
                  p.write_text(s, encoding='utf-8')

          # Landing: preserva o nome próprio da Comissão e normaliza usos genéricos.
          replace_all('index.html', [
              ('pessoas que permanecem no Cadastro Reserva', 'pessoas que permanecem no cadastro de reserva'),
              ('todo o Cadastro Reserva', 'todo o cadastro de reserva'),
              ('integrantes do Cadastro Reserva', 'integrantes do cadastro de reserva'),
              ('do MGI ou da Andeps', 'do MGI ou da ANDEPS'),
              ('ao cadastro reserva', 'ao cadastro de reserva'),
              ('Expectativas do cadastro reserva', 'Expectativas do cadastro de reserva'),
              ('Comissão do Cadastro Reserva de ATPS — CPNU 1', 'Comissão do Cadastro Reserva de ATPS do CPNU 1'),
          ])

          # Por que Lula: data factual, consulta e sigla CPNU.
          replace_all('apoio-lula/index.html', [
              ('Atualização: 10 de setembro de 2026', 'Corte factual: 10 de setembro de 2026'),
              ('pessoas que permanecem no Cadastro Reserva', 'pessoas que permanecem no cadastro de reserva'),
              ('todo o Cadastro Reserva', 'todo o cadastro de reserva'),
              ('reforça a legitimidade da decisão da Comissão', 'reforça a legitimidade do posicionamento da Comissão'),
              ('O CNU, instituído', 'O CPNU, instituído'),
              ('CNU não garante', 'CPNU não garante'),
              ('>CNU · Fonte primária<', '>CPNU · Fonte primária<'),
              ('ATPS e CNU', 'ATPS e CPNU'),
          ])

          # Fundamentos: mesma terminologia e uma correção gramatical remanescente.
          replace_all('fundamentos/index.html', [
              ('pessoas que permanecem no Cadastro Reserva', 'pessoas que permanecem no cadastro de reserva'),
              ('todo o Cadastro Reserva', 'todo o cadastro de reserva'),
              ('O CNU, instituído', 'O CPNU, instituído'),
              ('CNU não garante', 'CPNU não garante'),
              ('“CNU”', '“CPNU”'),
              ('ATPS e CNU', 'ATPS e CPNU'),
              ('>CNU · Fonte primária<', '>CPNU · Fonte primária<'),
              ('Bolsa Família retomado em lei, com piso e adicionais conforme composição familiar.', 'O Bolsa Família foi retomado em lei, com piso e adicionais conforme composição familiar.'),
          ])

          # Candidaturas: altera apenas a camada textual pública antes do dataset e
          # rótulos de exibição controlados no JSON; ementas oficiais ficam intactas.
          p = Path('candidaturas/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script id="dataset" type="application/json">'
          if marker not in s:
              raise SystemExit('Dataset de candidaturas não localizado')
          public, data = s.split(marker, 1)
          public = public.replace('ATPS / CR / CNU', 'ATPS / CR / CPNU')
          public = public.replace('Concurso Público Nacional Unificado, também referido como CPNU.', 'Concurso Público Nacional Unificado (CPNU).')
          data = data.replace('"cnu":"CNU e outros cadastros"', '"cnu":"CPNU e outros cadastros"')
          data = data.replace('"escopo":"CNU / concursos"', '"escopo":"CPNU / concursos"')
          data = data.replace('"escopo":"CNU / outras carreiras"', '"escopo":"CPNU / outras carreiras"')
          p.write_text(public + marker + data, encoding='utf-8')
          PY
      - name: QA terminológico e de links internos
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit, unquote
          import re, sys

          pages = {
              'index.html': 'https://chamamais-atps-eleicoes-2026.vercel.app/',
              'apoio-lula/index.html': 'https://chamamais-atps-eleicoes-2026.vercel.app/apoio-lula/',
              'fundamentos/index.html': 'https://chamamais-atps-eleicoes-2026.vercel.app/fundamentos/',
              'candidaturas/index.html': 'https://chamamais-atps-eleicoes-2026.vercel.app/candidaturas/',
          }
          errors = []
          warnings = []

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links=[]; self.ids=set(); self.canon=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if 'id' in d: self.ids.add(d['id'])
                  if tag == 'a' and 'name' in d: self.ids.add(d['name'])
                  if tag == 'link' and d.get('rel') == 'canonical' and d.get('href'):
                      self.canon.append(d['href'])
                  for key in ('href','src'):
                      if d.get(key): self.links.append((tag,key,d[key],d))

          parsed={}
          for page in pages:
              parser=P(); parser.feed(Path(page).read_text(encoding='utf-8')); parsed[page]=parser
              if parser.canon != [pages[page]]:
                  errors.append(f'{page}: canonical inesperada: {parser.canon}')

          # Resolve links internos e âncoras.
          for page, parser in parsed.items():
              base=Path(page).parent
              for tag,key,raw,attrs in parser.links:
                  if raw.startswith(('#','mailto:','tel:','javascript:','data:','blob:')):
                      if raw.startswith('#') and raw[1:] and raw[1:] not in parser.ids:
                          errors.append(f'{page}: âncora inexistente {raw}')
                      continue
                  parts=urlsplit(raw)
                  if parts.scheme in ('http','https') or parts.netloc:
                      if attrs.get('target') == '_blank':
                          rel=set((attrs.get('rel') or '').split())
                          if not {'noopener','noreferrer'}.issubset(rel):
                              errors.append(f'{page}: target=_blank sem rel seguro: {raw}')
                      continue
                  path=unquote(parts.path)
                  if not path:
                      target=Path(page)
                  elif path.startswith('/'):
                      target=Path(path.lstrip('/'))
                  else:
                      target=(base/path)
                  if str(target).endswith('/') or target.is_dir():
                      target=target/'index.html'
                  # Normaliza .. sem exigir resolve absoluto.
                  target=Path(*[x for x in target.parts if x != '.'])
                  # pathlib não elimina .. lexicalmente; usa resolve sobre workspace.
                  full=target.resolve()
                  root=Path('.').resolve()
                  try:
                      rel=full.relative_to(root)
                  except ValueError:
                      errors.append(f'{page}: link escapa do repositório: {raw}')
                      continue
                  if not full.exists():
                      errors.append(f'{page}: alvo interno ausente: {raw} -> {rel}')
                      continue
                  if parts.fragment and full.suffix.lower()=='.html':
                      t=str(rel).replace('\\','/')
                      if t not in parsed:
                          q=P(); q.feed(full.read_text(encoding='utf-8')); parsed[t]=q
                      if parts.fragment not in parsed[t].ids:
                          errors.append(f'{page}: âncora {parts.fragment} ausente em {t}')

          # Links críticos presentes nas páginas corretas.
          landing=Path('index.html').read_text(encoding='utf-8')
          for u in [
              'https://drive.google.com/file/d/1ruX45Z09uhSPNebIKXBvZ5qLYfPJKNKO/view',
              'https://drive.google.com/file/d/12qZqODh8K7D4fxEDQ0zt2F8Hby7-0Prv/view',
          ]:
              if u not in landing:
                  errors.append('Landing sem PDF crítico: '+u)
          for page in ['apoio-lula/index.html','fundamentos/index.html']:
              s=Path(page).read_text(encoding='utf-8')
              if 'dadosabertos.tse.jus.br/dataset/candidatos-2026' not in s:
                  errors.append(f'{page}: sem link para base eleitoral do TSE')
              if 'dadosabertos.tse.jus.br/dataset/candidatos-2026/resource/433ac1f4-07dc-44a2-bcbe-c87a2073721a' not in s:
                  errors.append(f'{page}: sem link para pacote de propostas do TSE')

          # Terminologia pública que não deve reaparecer.
          idx=landing
          if 'cadastro reserva' in idx.lower():
              errors.append('index.html: ainda há “cadastro reserva” sem preposição')
          if 'Andeps' in idx:
              errors.append('index.html: ainda há “Andeps”; usar ANDEPS')
          for page in ['apoio-lula/index.html','fundamentos/index.html']:
              s=Path(page).read_text(encoding='utf-8')
              if 'pessoas que permanecem no Cadastro Reserva' in s or 'todo o Cadastro Reserva' in s:
                  errors.append(f'{page}: uso genérico de Cadastro Reserva ainda em maiúsculas')
          cand=Path('candidaturas/index.html').read_text(encoding='utf-8').split('<script id="dataset"',1)[0]
          if 'ATPS / CR / CNU' in cand:
              errors.append('candidaturas: sigla CNU ainda visível na legenda')

          if errors:
              print('\n'.join('ERRO: '+e for e in errors))
              sys.exit(1)
          print('QA OK: terminologia, canonical, rel seguro, links internos e âncoras verificados.')
          PY
      - name: Commit e remover workflow temporário
        run: |
          rm .github/workflows/final-terminology-links-qa.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html apoio-lula/index.html fundamentos/index.html candidaturas/index.html .github/workflows/final-terminology-links-qa.yml
          if git diff --cached --quiet; then
            echo "Nenhuma alteração necessária"
            exit 0
          fi
          git commit -m "Padroniza terminologia e valida links do microsite"
          git push
