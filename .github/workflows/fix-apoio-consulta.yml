name: Corrigir bloco consulta apoio Lula

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-apoio-consulta.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir estrutura
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apoio-lula/index.html')
          s = p.read_text(encoding='utf-8')
          start = s.find('<aside class="consult-note" aria-labelledby="consulta-cr-lula">')
          if start < 0:
              raise SystemExit('Bloco consult-note não encontrado')
          end = s.find('</aside>', start)
          if end < 0:
              raise SystemExit('Fechamento do consult-note não encontrado')
          end += len('</aside>')
          block = s[start:end]
          s = s[:start] + s[end:]
          anchor = '</header></div><nav class="jump"'
          if anchor not in s:
              raise SystemExit('Âncora hero/nav não encontrada')
          s = s.replace(anchor, '</header></div><div class="wrap">' + block + '</div><nav class="jump"', 1)
          if '<header class="hero"><div' not in s or '117 de 123 participantes (95,1%)' not in s:
              raise SystemExit('QA estrutural falhou')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar correção e remover workflow
        run: |
          rm -f .github/workflows/fix-apoio-consulta.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Corrige posição do bloco de consulta em Por que Lula"
          git push origin main
