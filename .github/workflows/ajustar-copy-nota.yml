name: Ajustar copy da nota

on: push

permissions:
  contents: write

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Editar index
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          new_opening = '''      <p class="nota-opening">
        A Comissão do Cadastro Reserva de ATPS do CPNU 1, composta por voluntários que atuam de
        forma colegiada na condução do movimento #ChamaMaisATPS, deliberou, em 9 de setembro de 2026,
        após análise dos planos de governo dos dois candidatos mais bem colocados no cenário eleitoral
        consultado, manifestar apoio público à candidatura de Lula à Presidência da República e divulgar
        candidaturas parlamentares selecionadas a partir de critérios relacionados à defesa da democracia,
        das políticas sociais, da capacidade do Estado, da valorização do serviço público federal e do
        princípio do concurso público, previsto no art. 37, II, da Constituição Federal de 1988.
        Em seguida, os dois pontos do posicionamento — o apoio público a Lula e a divulgação de candidaturas
        parlamentares segundo critérios públicos e verificáveis — foram submetidos à consulta das pessoas
        que permanecem no Cadastro Reserva, realizada em 11 e 12 de setembro de 2026 no grupo de WhatsApp
        “Mobilização pelo CF3 – CR ATPS”. Entre os participantes, houve ampla maioria favorável a ambos.
      </p>'''

          s, n1 = re.subn(r'      <p class="nota-opening">.*?      </p>', new_opening, s, count=1, flags=re.S)
          if n1 != 1:
              raise SystemExit(f'Falha ao substituir abertura: {n1}')

          old_rep_pattern = r'''            <p>A decisão de manifestar apoio eleitoral foi deliberada pela Comissão do Cadastro Reserva de ATPS do CPNU 1 em 9 de setembro de 2026\..*?</p>\n            <p>A consulta reforça a legitimidade do posicionamento, mas não pressupõe unanimidade entre todas as pessoas integrantes do Cadastro Reserva, não substitui suas escolhas individuais e não deve ser interpretada como manifestação institucional de toda a carreira de ATPS, do MGI ou da Andeps\.</p>'''
          new_rep = '''            <p>O posicionamento é da Comissão do Cadastro Reserva de ATPS do CPNU 1, no âmbito do movimento #ChamaMaisATPS. A consulta posterior reforça sua legitimidade entre as pessoas que participaram, mas não transforma essa posição em manifestação institucional de todo o Cadastro Reserva, de toda a carreira de ATPS, do MGI ou da Andeps, nem substitui as escolhas políticas individuais de seus integrantes.</p>
            <p>Os percentuais divulgados referem-se exclusivamente às pessoas que participaram voluntariamente das consultas e não pressupõem unanimidade nem representatividade estatística de todo o Cadastro Reserva.</p>'''
          s, n2 = re.subn(old_rep_pattern, new_rep, s, count=1, flags=re.S)
          if n2 != 1:
              raise SystemExit(f'Falha ao substituir representatividade: {n2}')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validar
        run: |
          grep -Fq 'os dois pontos do posicionamento — o apoio público a Lula e a divulgação de candidaturas' index.html
          grep -Fq 'previsto no art. 37, II, da Constituição Federal de 1988' index.html
          grep -Fq 'Os percentuais divulgados referem-se exclusivamente às pessoas que participaram voluntariamente das consultas' index.html

      - name: Commitar
        run: |
          git config user.name "Nílian Silva"
          git config user.email "niliancs@gmail.com"
          rm .github/workflows/ajustar-copy-nota.yml
          git add index.html .github/workflows/ajustar-copy-nota.yml
          git commit -m "Ajusta abertura e representatividade da nota eleitoral"
          git push origin main
