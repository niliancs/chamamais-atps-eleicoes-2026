name: Add direct plan links
on:
  push:
    paths:
      - '.github/workflows/add-direct-plan-links.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add direct PDF links to bibliography
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('fundamentos/index.html')
          s = p.read_text(encoding='utf-8')

          old_lula = '''<li id="fonte-PROG"><strong>PROG · Documento da candidatura</strong> — 2026. <a href="https://dadosabertos.tse.jus.br/dataset/candidatos-2026/resource/433ac1f4-07dc-44a2-bcbe-c87a2073721a" target="_blank" rel="noopener noreferrer">Planos de governo presidenciais no TSE Dados Abertos — pacote ZIP (contém programa de Lula)</a><br><span>'''
          new_lula = '''<li id="fonte-PROG"><strong>PROG · Documento da candidatura</strong> — 2026. <a href="https://dadosabertos.tse.jus.br/dataset/candidatos-2026/resource/433ac1f4-07dc-44a2-bcbe-c87a2073721a" target="_blank" rel="noopener noreferrer">Planos de governo presidenciais no TSE Dados Abertos — pacote ZIP (contém programa de Lula)</a> · <a href="https://drive.google.com/file/d/1ruX45Z09uhSPNebIKXBvZ5qLYfPJKNKO/view" target="_blank" rel="noopener noreferrer">Abrir PDF utilizado — Lula</a><br><span>'''

          old_flavio = '''<li id="fonte-FLAVIO"><strong>FLAVIO · Documento da candidatura</strong> — 2026. <a href="https://dadosabertos.tse.jus.br/dataset/candidatos-2026/resource/433ac1f4-07dc-44a2-bcbe-c87a2073721a" target="_blank" rel="noopener noreferrer">Planos de governo presidenciais no TSE Dados Abertos — pacote ZIP (arquivo de Flávio: 2026BR280002551544_01.pdf)</a><br><span>'''
          new_flavio = '''<li id="fonte-FLAVIO"><strong>FLAVIO · Documento da candidatura</strong> — 2026. <a href="https://dadosabertos.tse.jus.br/dataset/candidatos-2026/resource/433ac1f4-07dc-44a2-bcbe-c87a2073721a" target="_blank" rel="noopener noreferrer">Planos de governo presidenciais no TSE Dados Abertos — pacote ZIP (arquivo de Flávio: 2026BR280002551544_01.pdf)</a> · <a href="https://drive.google.com/file/d/12qZqODh8K7D4fxEDQ0zt2F8Hby7-0Prv/view" target="_blank" rel="noopener noreferrer">Abrir PDF utilizado — Flávio Bolsonaro</a><br><span>'''

          if old_lula not in s:
              raise SystemExit('Entrada PROG não localizada exatamente')
          if old_flavio not in s:
              raise SystemExit('Entrada FLAVIO não localizada exatamente')

          s = s.replace(old_lula, new_lula, 1).replace(old_flavio, new_flavio, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Verify links
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('fundamentos/index.html').read_text(encoding='utf-8')
          checks = [
              ('fonte-PROG', 'https://drive.google.com/file/d/1ruX45Z09uhSPNebIKXBvZ5qLYfPJKNKO/view'),
              ('fonte-FLAVIO', 'https://drive.google.com/file/d/12qZqODh8K7D4fxEDQ0zt2F8Hby7-0Prv/view'),
          ]
          for anchor, url in checks:
              pos = s.find(f'id="{anchor}"')
              if pos < 0 or url not in s[pos:pos+1400]:
                  raise SystemExit(f'Link direto não verificado em {anchor}')
          print('OK: PDFs diretos presentes nas duas entradas bibliográficas.')
          PY
      - name: Commit and self-remove
        run: |
          rm .github/workflows/add-direct-plan-links.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fundamentos/index.html .github/workflows/add-direct-plan-links.yml
          git commit -m "Adiciona PDFs diretos dos planos às fontes do dossiê"
          git push
