name: Remove label candidaturas

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-left-center-label.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remover trecho do cabeçalho de candidaturas
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('candidaturas/index.html')
          s = p.read_text(encoding='utf-8')
          old = '<div class="overline">Eleições 2026 · candidaturas de esquerda e centro-esquerda</div>'
          new = '<div class="overline">Eleições 2026</div>'
          if old not in s:
              raise SystemExit('Trecho alvo não encontrado')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: QA
        shell: bash
        run: |
          grep -q '<div class="overline">Eleições 2026</div>' candidaturas/index.html
          ! grep -q 'candidaturas de esquerda e centro-esquerda' candidaturas/index.html
      - name: Commit e limpar workflow
        shell: bash
        run: |
          rm .github/workflows/remove-left-center-label.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add candidaturas/index.html .github/workflows/remove-left-center-label.yml
          git commit -m 'Remove recorte ideológico do cabeçalho de candidaturas'
          git push
