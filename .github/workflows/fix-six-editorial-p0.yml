name: Fix six editorial P0 issues

on:
  push:
    paths:
      - '.github/workflows/fix-six-editorial-p0.yml'

permissions:
  contents: write

jobs:
  fix-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Apply requested editorial corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # --- Candidaturas ---
          p = Path('candidaturas/index.html')
          s = p.read_text(encoding='utf-8')

          exact = {
              'Candidaturas, cargos atuais e registros de atuação relacionados a ATPS, ao cadastro de reserva e ao serviço público.':
                  'Candidaturas, cargos ou condições documentadas e registros de atuação relacionados a ATPS, ao cadastro de reserva e ao serviço público.',
              'Consulte os nomes levantados que disputam a Câmara e o Senado, com cargos atuais, registros de atuação e fontes.':
                  'Consulte os nomes levantados que disputam a Câmara e o Senado, com cargos ou condições documentadas, registros de atuação e fontes.',
              'Consulte o cargo atual, a disputa em 2026 e o que cada documento comprova.':
                  'Consulte o cargo ou condição documentada, a disputa em 2026 e o que cada documento comprova.',
              'ATPS é a carreira de Analista Técnico de Políticas Sociais, do serviço público federal.':
                  'ATPS é o cargo de Analista Técnico de Políticas Sociais, integrante da Carreira de Desenvolvimento de Políticas Sociais, do serviço público federal.',
              'O cargo atual e o cargo disputado são apresentados separadamente.':
                  'O cargo ou condição documentada e o cargo disputado são apresentados separadamente.',
              'Cada ficha reúne identificação eleitoral, cargo atual e fontes para os registros apresentados.':
                  'Cada ficha reúne identificação eleitoral, cargo ou condição documentada e fontes para os registros apresentados.',
              'os cargos atuais são conferidos separadamente nos cadastros parlamentares.':
                  'os cargos ou condições de exercício são conferidos separadamente nos cadastros parlamentares.'
          }
          for old, new in exact.items():
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'Esperava 1 ocorrência para: {old!r}; encontrei {count}')
              s = s.replace(old, new, 1)

          # Nas 32 fichas cuja única comprovação funcional vem da EMP 48/2025,
          # o campo não pode ser apresentado como cargo atual.
          role_pat = re.compile(
              r'(<div class="current-role"><span class="label">)Cargo ou condição atual(</span><strong>Deputad(?:a|o) federal na data da EMP 48/2025</strong>)'
          )
          s, role_count = role_pat.subn(r'\1Cargo na data do ato (20/05/2025)\2', s)

          detail_pat = re.compile(
              r'<dt>Cargo ou condição atual</dt>(<dd>Deputad(?:a|o) federal na data da EMP 48/2025 · Condição documentada pelo ato; exercício atual não rechecado individualmente neste levantamento</dd>)'
          )
          s, detail_count = detail_pat.subn(r'<dt>Cargo na data do ato (20/05/2025)</dt>\1', s)

          if role_count != 32 or detail_count != 32:
              raise SystemExit(f'Esperava 32 fichas EMP; alteradas no cartão={role_count}, detalhes={detail_count}')

          # Diferenciar apoio à pauta de apoio eleitoral, inclusive no dataset usado pelo CSV.
          upper_count = s.count('Apoio registrado pelo movimento')
          lower_count = s.count('apoio registrado pelo movimento')
          if upper_count == 0 and lower_count == 0:
              raise SystemExit('Nenhuma ocorrência de apoio registrado encontrada para corrigir')
          s = s.replace('Apoio registrado pelo movimento', 'Apoio à pauta registrado pelo movimento')
          s = s.replace('apoio registrado pelo movimento', 'apoio à pauta registrado pelo movimento')

          p.write_text(s, encoding='utf-8')
          print(f'Candidaturas: 32 rótulos de cargo datado corrigidos; apoios corrigidos: {upper_count} maiúsculos + {lower_count} minúsculos.')

          # --- Home ---
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s, n1 = re.subn(
              r'após análise comparativa\s+dos planos de governo dos dois candidatos mais bem posicionados nas pesquisas eleitorais\s+para a Presidência da República,',
              'após análise comparativa dos planos de governo de Lula e Flávio Bolsonaro, tomados como referência no cenário eleitoral consultado,',
              s,
              count=1,
          )
          if n1 != 1:
              raise SystemExit(f'Correção do enquadramento eleitoral na Home: esperado 1, encontrado {n1}')

          s, n2 = re.subn(
              r'por manifestar apoio à candidatura\s+de Lula à Presidência da República e a outras candidaturas selecionadas a partir de critérios\s+relacionados à defesa da democracia e das políticas sociais, ao fortalecimento da capacidade\s+do Estado, à valorização do serviço público federal e ao respeito ao princípio constitucional\s+do concurso público, previsto no art\. 37, II, da Constituição Federal de 1988\.',
              'por manifestar apoio à candidatura de Lula à Presidência da República. Eventuais apoios adicionais a outras candidaturas serão identificados explicitamente, a partir de critérios relacionados à defesa da democracia e das políticas sociais, ao fortalecimento da capacidade do Estado, à valorização do serviço público federal e ao respeito ao princípio constitucional do concurso público, previsto no art. 37, II, da Constituição Federal de 1988.',
              s,
              count=1,
          )
          if n2 != 1:
              raise SystemExit(f'Correção dos apoios adicionais na Home: esperado 1, encontrado {n2}')

          p.write_text(s, encoding='utf-8')

          # --- Por que Lula ---
          p = Path('apoio-lula/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'A pesquisa não apresenta esta posição como orientação oficial de qualquer movimento ou instituição citada.'
          new = 'A posição é da Comissão do Cadastro Reserva de ATPS do CPNU 1 / #ChamaMaisATPS e não é atribuída às instituições citadas como fonte.'
          if s.count(old) != 1:
              raise SystemExit(f'Nota de autoria em Por que Lula: esperado 1, encontrado {s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: QA requested corrections
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          errors=[]
          cand=Path('candidaturas/index.html').read_text(encoding='utf-8')
          home=Path('index.html').read_text(encoding='utf-8')
          lula=Path('apoio-lula/index.html').read_text(encoding='utf-8')

          # Candidaturas
          required_cand = [
              'ATPS é o cargo de Analista Técnico de Políticas Sociais, integrante da Carreira de Desenvolvimento de Políticas Sociais, do serviço público federal.',
              'Apoio à pauta registrado pelo movimento',
              'Cargo na data do ato (20/05/2025)',
              'Candidaturas, cargos ou condições documentadas e registros de atuação relacionados a ATPS, ao cadastro de reserva e ao serviço público.',
              'O cargo ou condição documentada e o cargo disputado são apresentados separadamente.',
          ]
          for x in required_cand:
              if x not in cand: errors.append(f'Candidaturas: texto esperado ausente: {x}')

          forbidden_cand = [
              'ATPS é a carreira de Analista Técnico de Políticas Sociais',
              'Apoio registrado pelo movimento',
              'apoio registrado pelo movimento',
          ]
          for x in forbidden_cand:
              if x in cand: errors.append(f'Candidaturas: texto antigo ainda presente: {x}')

          role_new = len(re.findall(r'<span class="label">Cargo na data do ato \(20/05/2025\)</span><strong>Deputad(?:a|o) federal na data da EMP 48/2025</strong>', cand))
          detail_new = len(re.findall(r'<dt>Cargo na data do ato \(20/05/2025\)</dt><dd>Deputad(?:a|o) federal na data da EMP 48/2025', cand))
          if role_new != 32: errors.append(f'Candidaturas: cartões EMP corrigidos={role_new}, esperado 32')
          if detail_new != 32: errors.append(f'Candidaturas: detalhes EMP corrigidos={detail_new}, esperado 32')
          if re.search(r'<span class="label">Cargo ou condição atual</span><strong>Deputad(?:a|o) federal na data da EMP 48/2025</strong>', cand):
              errors.append('Candidaturas: ainda há ficha EMP rotulada como cargo atual')

          # Home
          if 'dois candidatos mais bem posicionados nas pesquisas eleitorais' in home:
              errors.append('Home: formulação ampla sobre pesquisas ainda presente')
          if 'e a outras candidaturas selecionadas' in home:
              errors.append('Home: apoio eleitoral não identificado ainda presente')
          if 'planos de governo de Lula e Flávio Bolsonaro, tomados como referência no cenário eleitoral consultado' not in home:
              errors.append('Home: nova formulação do cenário eleitoral ausente')
          if 'Eventuais apoios adicionais a outras candidaturas serão identificados explicitamente' not in home:
              errors.append('Home: nova regra para apoios adicionais ausente')

          # Por que Lula
          if 'A pesquisa não apresenta esta posição como orientação oficial de qualquer movimento ou instituição citada.' in lula:
              errors.append('Por que Lula: frase contraditória ainda presente')
          if 'A posição é da Comissão do Cadastro Reserva de ATPS do CPNU 1 / #ChamaMaisATPS e não é atribuída às instituições citadas como fonte.' not in lula:
              errors.append('Por que Lula: nova atribuição da posição ausente')

          if errors:
              raise SystemExit('\n'.join(errors))
          print('PASS: as seis correções P0 solicitadas estão aplicadas e os textos antigos não permanecem nas posições auditadas.')
          PY

      - name: Regenerate checksums
        run: |
          sha256sum index.html apoio-lula/index.html fundamentos/index.html candidaturas/index.html assets/styles.css README_RELEASE.md CHANGELOG.md QA_REPORT_FINAL.md > SHA256SUMS.txt

      - name: Commit corrections
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html apoio-lula/index.html candidaturas/index.html SHA256SUMS.txt
          git commit -m 'Fix requested editorial P0 issues'
          git push origin main
