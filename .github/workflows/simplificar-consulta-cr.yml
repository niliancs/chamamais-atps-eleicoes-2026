name: Simplificar consulta CR
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/simplificar-consulta-cr.yml'
permissions:
  contents: write
jobs:
  update-copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Simplificar resultados da consulta
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              'index.html': [
                  (
                      '<div class="number">117 de 123 participantes · 95,1% favoráveis</div>\n          <p>0 votos “NÃO”; 6 participantes (4,9%) preferiram que o movimento não se manifestasse eleitoralmente.</p>',
                      '<div class="number">95,1% dos participantes foram favoráveis</div>\n          <p>à manifestação pública de apoio à candidatura de Lula à Presidência da República.</p>'
                  ),
                  (
                      '<div class="number">93 de 103 participantes · 90,3% favoráveis</div>\n          <p>6 participantes (5,8%) votaram “NÃO”; 4 participantes (3,9%) preferiram apenas o posicionamento presidencial.</p>',
                      '<div class="number">90,3% dos participantes foram favoráveis</div>\n          <p>à divulgação de candidaturas selecionadas segundo critérios públicos e verificáveis relacionados às políticas sociais, ao serviço público, ao concurso público e à atuação concreta em defesa da pauta.</p>'
                  ),
              ],
              'apoio-lula/index.html': [
                  (
                      '<p><strong>117 de 123 participantes (95,1%)</strong> foram favoráveis; não houve voto “NÃO”; 6 participantes (4,9%) preferiram que o movimento não se manifestasse eleitoralmente.</p>',
                      '<p><strong>95,1% dos participantes foram favoráveis</strong> à manifestação pública de apoio à candidatura de Lula à Presidência da República.</p>'
                  ),
              ],
              'candidaturas/index.html': [
                  (
                      '<p>Em consulta voluntária de 24 horas no grupo “Mobilização pelo CF3 – CR ATPS”, <b>93 de 103 participantes (90,3%)</b> foram favoráveis à divulgação de candidaturas parlamentares selecionadas a partir de critérios públicos e verificáveis relacionados às políticas sociais, ao serviço público, ao concurso público e à atuação concreta em defesa da pauta. 6 participantes (5,8%) votaram “NÃO” e 4 (3,9%) preferiram apenas o posicionamento presidencial.</p>',
                      '<p>Em consulta voluntária de 24 horas no grupo “Mobilização pelo CF3 – CR ATPS”, <b>90,3% dos participantes foram favoráveis</b> à divulgação de candidaturas parlamentares selecionadas a partir de critérios públicos e verificáveis relacionados às políticas sociais, ao serviço público, ao concurso público e à atuação concreta em defesa da pauta.</p>'
                  ),
              ],
              'fundamentos/index.html': [
                  (
                      '<p><strong>117 de 123 participantes (95,1%)</strong> foram favoráveis ao apoio público a Lula. Em consulta separada, <strong>93 de 103 participantes (90,3%)</strong> foram favoráveis à divulgação de candidaturas parlamentares selecionadas segundo critérios públicos e verificáveis.</p>',
                      '<p><strong>95,1% dos participantes foram favoráveis</strong> ao apoio público a Lula. Em consulta separada, <strong>90,3% dos participantes foram favoráveis</strong> à divulgação de candidaturas parlamentares selecionadas segundo critérios públicos e verificáveis.</p>'
                  ),
              ],
          }

          for filename, reps in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              for old, new in reps:
                  if old not in text:
                      raise SystemExit(f'Trecho esperado não encontrado em {filename}: {old[:120]}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')

          public_files = [Path('index.html'), Path('apoio-lula/index.html'), Path('candidaturas/index.html'), Path('fundamentos/index.html')]
          combined = '\n'.join(p.read_text(encoding='utf-8') for p in public_files)
          forbidden = ['117 de 123', '93 de 103', '0 votos “NÃO”', '6 participantes (5,8%)', '4 participantes (3,9%)', '6 (3,9%) preferiram']
          for phrase in forbidden:
              if phrase in combined:
                  raise SystemExit(f'Ainda existe número bruto da consulta: {phrase}')
          for pct in ['95,1%', '90,3%']:
              if pct not in combined:
                  raise SystemExit(f'Percentual esperado ausente: {pct}')
      - name: Validar alterações
        run: |
          git diff --check
          git diff -- index.html apoio-lula/index.html candidaturas/index.html fundamentos/index.html
      - name: Commitar ajuste e remover workflow temporário
        run: |
          rm .github/workflows/simplificar-consulta-cr.yml
          git config user.name "Nílian Silva"
          git config user.email "niliancs@gmail.com"
          git add index.html apoio-lula/index.html candidaturas/index.html fundamentos/index.html .github/workflows/simplificar-consulta-cr.yml
          git commit -m "Simplifica resultados da consulta do CR no site"
          git push origin main
