# rerun after fixing footer asset transparency
name: Production footer QA
on:
  push:
    branches: [qa-prod-footer-20260912]
  workflow_dispatch:

jobs:
  qa:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Check production footer
        run: |
          mkdir -p qa-prod
          cat > qa-prod.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const pages=[['home','/'],['apoio-lula','/apoio-lula/'],['fundamentos','/fundamentos/'],['candidaturas','/candidaturas/']];
          const base='https://chamamais-atps-eleicoes-2026.vercel.app';
          for (const [name,path] of pages){
            const page=await browser.newPage({viewport:{width:1440,height:900}});
            const responses=[];
            page.on('response',r=>{ if(r.url().includes('selo_rodape_chama_atps')) responses.push({url:r.url(),status:r.status(),ct:r.headers()['content-type']||''}); });
            const resp=await page.goto(base+path,{waitUntil:'networkidle',timeout:60000});
            const data=await page.evaluate(()=>{
              const explicit=document.querySelector('.brand-signature--footer');
              const foot=document.querySelector('footer.foot');
              const e=explicit?getComputedStyle(explicit):null;
              const er=explicit?.getBoundingClientRect();
              const p=foot?getComputedStyle(foot,'::before'):null;
              return {title:document.title, explicit:!!explicit, box:er?{w:er.width,h:er.height}:null, bg:e?.backgroundImage||null, pseudoContent:p?.content||null, pseudoBg:p?.backgroundImage||null};
            });
            console.log('PROD',name,'pageStatus',resp?.status(),JSON.stringify(data),'assetResponses',JSON.stringify(responses));
            const footer=page.locator('footer').last();
            if(await footer.count()) await footer.screenshot({path:`qa-prod/${name}-footer.png`});
            await page.close();
          }
          const assetPage=await browser.newPage({viewport:{width:1200,height:700}});
          await assetPage.goto(base+'/assets/selo_rodape_chama_atps.webp',{waitUntil:'networkidle',timeout:60000});
          const assetData=await assetPage.evaluate(()=>{
            const img=document.querySelector('img');
            if(!img) return {img:false};
            const c=document.createElement('canvas'); c.width=img.naturalWidth; c.height=img.naturalHeight;
            const ctx=c.getContext('2d'); ctx.drawImage(img,0,0);
            const d=ctx.getImageData(0,0,c.width,c.height).data;
            let nonTransparent=0, blueish=0, whiteish=0;
            for(let i=0;i<d.length;i+=4){
              const [r,g,b,a]=[d[i],d[i+1],d[i+2],d[i+3]];
              if(a>8){ nonTransparent++; if(b>r*1.05 && b>g*1.05) blueish++; if(r>235&&g>235&&b>235) whiteish++; }
            }
            return {img:true,w:img.naturalWidth,h:img.naturalHeight,nonTransparent,blueish,whiteish,total:c.width*c.height};
          });
          console.log('ASSET_PIXELS',JSON.stringify(assetData));
          await assetPage.screenshot({path:'qa-prod/asset-direct.png',fullPage:true});
          await assetPage.close();
          await browser.close();
          EOF
          node qa-prod.mjs | tee qa-prod/metrics.log
      - uses: actions/upload-artifact@v4
        with:
          name: production-footer-qa
          path: qa-prod
