name: Rename public candidaturas labels

on:
  push:
    paths:
      - '.github/workflows/rename-public-candidaturas.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Remove internal version labels from public candidaturas page
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('candidaturas/index.html')
          s = p.read_text(encoding='utf-8')
          old_og = '<meta property="og:title" content="Levantamento de candidaturas e atuação parlamentar v4.6 | Chama + ATPS 2026">'
          new_og = '<meta property="og:title" content="Candidaturas e atuação parlamentar | Chama + ATPS 2026">'
          old_band = '<div class="edition">Corte 10 set. 2026 · v4.6 · QA 11 set.</div>'
          new_band = '<div class="edition">Corte factual 10 set. 2026 · atualização 11 set.</div>'
          if old_og not in s:
              raise SystemExit('OG title alvo não encontrado')
          if old_band not in s:
              raise SystemExit('Faixa superior alvo não encontrada')
          s = s.replace(old_og, new_og, 1).replace(old_band, new_band, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Regenerate checksums
        run: |
          sha256sum index.html apoio-lula/index.html fundamentos/index.html candidaturas/index.html assets/styles.css README_RELEASE.md CHANGELOG.md QA_REPORT_FINAL.md > SHA256SUMS.txt
      - name: Commit patch
        run: |
          git config user.name 'Nílian Silva'
          git config user.email 'niliancs@gmail.com'
          git add candidaturas/index.html SHA256SUMS.txt
          git commit -m 'Remove internal version labels from public candidaturas page'
          git push origin main
