name: Visual brand final QA

on:
  push:
    branches: [visual-qa-final-20260912]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: |
          npm init -y >/dev/null 2>&1
          npm install playwright@1.55.0 >/dev/null 2>&1
          npx playwright install --with-deps chromium >/dev/null 2>&1
      - name: Start local server
        run: |
          python3 -m http.server 4173 >/tmp/server.log 2>&1 &
          sleep 2
      - name: Render and inspect
        run: |
          mkdir -p qa-artifacts
          cat > qa.mjs <<'EOF'
          import { chromium } from 'playwright';
          const browser = await chromium.launch({headless:true});
          const pages=[['home','/'],['apoio-lula','/apoio-lula/'],['fundamentos','/fundamentos/'],['candidaturas','/candidaturas/']];
          const viewports=[['desktop',{width:1440,height:900}],['mobile',{width:390,height:844}]];
          let failed=false;
          for(const [vpname,viewport] of viewports){
            const ctx=await browser.newContext({viewport});
            for(const [name,path] of pages){
              const page=await ctx.newPage();
              await page.goto('http://127.0.0.1:4173'+path,{waitUntil:'networkidle'});
              const m=await page.evaluate(async()=>{
                const hero=document.querySelector('.brand-signature--hero');
                const hs=hero?getComputedStyle(hero):null;
                let src=null,naturalWidth=0,naturalHeight=0,decoded=false;
                if(hs){
                  const match=hs.backgroundImage.match(/url\(["']?(.*?)["']?\)/);
                  src=match?.[1]||null;
                  if(src){
                    const img=new Image(); img.src=src;
                    try{await img.decode(); decoded=true;}catch(e){}
                    naturalWidth=img.naturalWidth; naturalHeight=img.naturalHeight;
                  }
                }
                const footer=document.querySelector('.brand-signature--footer');
                const letter=footer?.querySelector('.brand-lettering');
                const brush=footer?.querySelector('.brand-brush-crop');
                const lr=letter?.getBoundingClientRect(); const br=brush?.getBoundingClientRect();
                const note=document.querySelector('.brand-heading-accent .brand-icon--megaphone');
                const ns=note?getComputedStyle(note):null;
                return {
                  overflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
                  src,naturalWidth,naturalHeight,decoded,
                  heroBox:hero?hero.getBoundingClientRect().toJSON():null,
                  childrenHidden:hero?[...hero.querySelectorAll('.brand-brush-crop,.brand-lettering,.brand-megaphone-crop')].every(el=>getComputedStyle(el).display==='none'):false,
                  footerContained:(lr&&br)?(lr.left>=br.left-.5&&lr.right<=br.right+.5&&lr.top>=br.top-.5&&lr.bottom<=br.bottom+.5):null,
                  noteTransform:ns?.transform||null
                };
              });
              console.log('QA',vpname,name,JSON.stringify(m));
              if(!m.decoded||m.naturalWidth!==280||m.naturalHeight!==140||!m.childrenHidden){console.error('FAIL HERO',vpname,name,m);failed=true;}
              if(m.footerContained===false){console.error('FAIL FOOTER',vpname,name,m);failed=true;}
              if(m.overflow>2){console.error('FAIL OVERFLOW',vpname,name,m);failed=true;}
              if(name==='home'&&m.noteTransform&&!m.noteTransform.includes('-1')){console.error('FAIL NOTE',vpname,name,m);failed=true;}
              await page.screenshot({path:`qa-artifacts/${name}-${vpname}-top.png`,fullPage:false});
              if(await page.locator('.brand-signature--hero').count()) await page.locator('.brand-signature--hero').first().screenshot({path:`qa-artifacts/${name}-${vpname}-hero.png`});
              if(await page.locator('.brand-signature--footer').count()) await page.locator('.brand-signature--footer').first().screenshot({path:`qa-artifacts/${name}-${vpname}-footer.png`});
              if(name==='home'&&await page.locator('.brand-heading-accent').count()) await page.locator('.brand-heading-accent').first().screenshot({path:`qa-artifacts/${name}-${vpname}-note.png`});
              await page.close();
            }
            await ctx.close();
          }
          await browser.close();
          if(failed)process.exit(1);
          console.log('QA PASS');
          EOF
          node qa.mjs | tee qa-artifacts/metrics.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-brand-final-qa
          path: qa-artifacts
