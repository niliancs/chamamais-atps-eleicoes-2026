name: Adicionar planos de governo como fontes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adicionar-planos-governo.yml'

permissions:
  contents: write

jobs:
  update-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Inserir fontes primárias
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          anchor = '''      </ul>\n    </section>\n\n    <!-- ── Nota metodológica ──────────────────────────────────── -->'''
          block = '''      </ul>\n\n      <div style="margin-top:2.5rem;padding-top:2rem;border-top:1px solid var(--cm-line);">\n        <h3 style="margin:0;font-size:1.1rem;font-weight:600;color:var(--cm-navy);">Fontes primárias — planos de governo</h3>\n        <p class="docs-desc" style="margin-top:.6rem;">Documentos de referência das candidaturas utilizados na análise do posicionamento.</p>\n\n        <ul class="doc-list" style="margin-top:1.25rem;">\n          <li>\n            <a class="doc-card" href="https://drive.google.com/file/d/1ruX45Z09uhSPNebIKXBvZ5qLYfPJKNKO/view" target="_blank" rel="noopener noreferrer">\n              <div class="doc-card-head">\n                <h3>Plano de Governo Lula 2026</h3>\n                <span class="doc-arrow" aria-hidden="true">↗</span>\n              </div>\n              <p class="doc-body">Documento apresentado pela candidatura para as Eleições 2026.</p>\n              <p class="doc-meta">PDF · fonte primária</p>\n            </a>\n          </li>\n          <li>\n            <a class="doc-card" href="https://drive.google.com/file/d/12qZqODh8K7D4fxEDQ0zt2F8Hby7-0Prv/view" target="_blank" rel="noopener noreferrer">\n              <div class="doc-card-head">\n                <h3>Plano de Governo Flávio Bolsonaro 2026</h3>\n                <span class="doc-arrow" aria-hidden="true">↗</span>\n              </div>\n              <p class="doc-body">Documento apresentado pela candidatura para as Eleições 2026.</p>\n              <p class="doc-meta">PDF · fonte primária</p>\n            </a>\n          </li>\n        </ul>\n      </div>\n    </section>\n\n    <!-- ── Nota metodológica ──────────────────────────────────── -->'''

          if 'Fontes primárias — planos de governo' in text:
              raise SystemExit('Bloco já existe')
          if anchor not in text:
              raise SystemExit('Âncora da seção de documentos não encontrada')

          text = text.replace(anchor, block, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Validar links e posição
        run: |
          grep -Fq 'Fontes primárias — planos de governo' index.html
          grep -Fq 'Plano de Governo Lula 2026' index.html
          grep -Fq '1ruX45Z09uhSPNebIKXBvZ5qLYfPJKNKO' index.html
          grep -Fq 'Plano de Governo Flávio Bolsonaro 2026' index.html
          grep -Fq '12qZqODh8K7D4fxEDQ0zt2F8Hby7-0Prv' index.html

      - name: Commitar alteração e remover workflow temporário
        run: |
          git config user.name "Nílian Silva"
          git config user.email "niliancs@gmail.com"
          rm .github/workflows/adicionar-planos-governo.yml
          git add index.html .github/workflows/adicionar-planos-governo.yml
          git commit -m "Adiciona planos de governo como fontes primárias"
          git push origin main
