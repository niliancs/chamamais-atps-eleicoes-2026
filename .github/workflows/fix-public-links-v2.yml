name: Fix public links and run link QA v2

on:
  push:
    paths:
      - '.github/workflows/fix-public-links-v2.yml'

permissions:
  contents: write

jobs:
  patch-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Patch public links
        run: |
          python - <<'PY'
          from pathlib import Path
          import html
          import re

          candidate = Path('candidaturas/index.html')
          s = candidate.read_text(encoding='utf-8')

          def replace_private_anchor(text, url, expected, suffix):
              pattern = re.compile(r'<a\b(?=[^>]*\bhref="' + re.escape(url) + r'")[^>]*>(.*?)</a>', re.S)
              matches = list(pattern.finditer(text))
              if len(matches) != expected:
                  raise SystemExit(f'Esperado {expected} anchors para {url}; encontrados {len(matches)}')
              def repl(m):
                  label = re.sub(r'<[^>]+>', '', m.group(1)).replace(' ↗', '').strip()
                  return f'<span class="small" title="Fonte interna não publicada">{html.escape(label)} — {suffix}</span>'
              return pattern.sub(repl, text)

          private_sources = [
              ('https://drive.google.com/file/d/1nwy7rlQILHfwbOFicGondAUSm6QNiGoz/view', 23, 'acervo interno'),
              ('https://docs.google.com/document/d/1pYx8WxnDAvNl8e1E2GpET76184-zevux/edit', 7, 'registro interno'),
              ('https://drive.google.com/file/d/11Qm4d3fikmDeJhQje6u9tVPR-8j1l-D2/view', 1, 'documento preservado no acervo interno'),
          ]
          for url, expected, suffix in private_sources:
              s = replace_private_anchor(s, url, expected, suffix)

          # Remove também os endereços privados embutidos no dataset/CSV público.
          for url, _, _ in private_sources:
              s = s.replace(url, '#criterios')

          old_senado = 'https://legis.senado.gov.br/sdleg-getter/documento?dm=9715865'
          new_senado = 'https://www25.senado.leg.br/web/atividade/materias/-/materia/164766'
          if s.count(old_senado) != 2:
              raise SystemExit(f'Link antigo do Senado: esperado 2, encontrado {s.count(old_senado)}')
          s = s.replace(old_senado, new_senado)

          sei_html = 'https://colaboragov.sei.gov.br/sei/controlador_externo.php?acao=documento_conferir&amp;id_orgao_acesso_externo=0'
          old_sei = f'<a href="{sei_html}" rel="noopener noreferrer" target="_blank">Documento oficial ↗</a>'
          new_sei = f'<a href="{sei_html}" rel="noopener noreferrer" target="_blank">Conferir autenticidade no SEI ↗</a>'
          if s.count(old_sei) != 1:
              raise SystemExit(f'Link de conferência SEI: esperado 1, encontrado {s.count(old_sei)}')
          s = s.replace(old_sei, new_sei, 1)

          for suffix in ['filename=RIC 1297/2025', 'filename=RIC 1649/2025']:
              for prefix in ['&amp;', '&']:
                  token = prefix + suffix
                  if s.count(token) != 1:
                      raise SystemExit(f'Parâmetro malformado {token!r}: esperado 1, encontrado {s.count(token)}')
                  s = s.replace(token, '')

          candidate.write_text(s, encoding='utf-8')

          tse = 'https://dadosabertos.tse.jus.br/dataset/candidatos-2026/resource/433ac1f4-07dc-44a2-bcbe-c87a2073721a'
          old_pair = (
              f'<span class="refs"><a href="{tse}" target="_blank" rel="noopener noreferrer">Planos de governo presidenciais no TSE Dados Abertos — pacote ZIP (contém programa de Lula)</a> · '
              f'<a href="{tse}" target="_blank" rel="noopener noreferrer">Planos de governo presidenciais no TSE Dados Abertos — pacote ZIP (arquivo de Flávio: 2026BR280002551544_01.pdf)</a></span>'
          )
          new_pair = (
              f'<span class="refs"><a href="{tse}" target="_blank" rel="noopener noreferrer">TSE — pacote oficial de propostas presidenciais 2026 (contém os PDFs auditados de Lula e Flávio Bolsonaro)</a></span>'
          )
          for fn in ['apoio-lula/index.html', 'fundamentos/index.html']:
              p = Path(fn)
              text = p.read_text(encoding='utf-8')
              if text.count(old_pair) != 1:
                  raise SystemExit(f'{fn}: par redundante TSE esperado 1 vez; encontrado {text.count(old_pair)}')
              p.write_text(text.replace(old_pair, new_pair, 1), encoding='utf-8')
          PY

      - name: Link-only regression QA
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import posixpath
          import subprocess

          files = [Path('index.html'), Path('apoio-lula/index.html'), Path('fundamentos/index.html'), Path('candidaturas/index.html')]

          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.ids = set()
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if d.get('id'):
                      self.ids.add(d['id'])
                  if tag == 'a' and d.get('href') is not None:
                      self.links.append(d)

          parsed = {}
          for p in files:
              parser = LinkParser()
              parser.feed(p.read_text(encoding='utf-8'))
              parsed[p] = parser

          errors = []
          external = []
          internal_checked = 0

          for p, parser in parsed.items():
              for a in parser.links:
                  href = a['href']
                  if ' ' in href:
                      errors.append(f'{p}: espaço literal em href: {href}')
                  if a.get('target') == '_blank':
                      rel = set((a.get('rel') or '').split())
                      if not {'noopener', 'noreferrer'}.issubset(rel):
                          errors.append(f'{p}: target=_blank sem noopener+noreferrer: {href}')

                  parts = urlsplit(href)
                  if parts.scheme in ('http', 'https'):
                      external.append(href)
                      continue
                  if parts.scheme in ('mailto', 'tel', 'javascript', 'data'):
                      continue

                  path_part = parts.path
                  frag = parts.fragment
                  if not path_part:
                      target = p
                  else:
                      raw = posixpath.normpath(posixpath.join(p.parent.as_posix(), path_part))
                      target = Path(raw)
                      if href.split('#', 1)[0].split('?', 1)[0].endswith('/'):
                          target = target / 'index.html'
                      internal_checked += 1
                      if not target.exists():
                          errors.append(f'{p}: link interno sem destino: {href} -> {target}')
                          continue
                  if frag and target == p and frag not in parser.ids:
                      errors.append(f'{p}: âncora inexistente: #{frag}')

          cand = Path('candidaturas/index.html').read_text(encoding='utf-8')
          forbidden = {
              'posts privados do Drive': '1nwy7rlQILHfwbOFicGondAUSm6QNiGoz',
              'registro interno editável': '1pYx8WxnDAvNl8e1E2GpET76184-zevux',
              'PDF SEI privado': '11Qm4d3fikmDeJhQje6u9tVPR-8j1l-D2',
              'domínio antigo Senado': 'legis.senado.gov.br',
              'filename RIC 1297': 'filename=RIC 1297/2025',
              'filename RIC 1649': 'filename=RIC 1649/2025',
          }
          for label, token in forbidden.items():
              if token in cand:
                  errors.append(f'candidaturas/index.html: referência residual — {label}')

          required = {
              'Senado estável': 'https://www25.senado.leg.br/web/atividade/materias/-/materia/164766',
              'Câmara RIC 1297': 'https://www.camara.leg.br/proposicoesWeb/prop_mostrarintegra?codteor=2887743',
              'Câmara RIC 1649': 'https://www.camara.leg.br/proposicoesWeb/prop_mostrarintegra?codteor=2895874',
              'Rótulo SEI': 'Conferir autenticidade no SEI ↗',
          }
          for label, token in required.items():
              if token not in cand:
                  errors.append(f'candidaturas/index.html: correção ausente — {label}')

          markers = cand.count('title="Fonte interna não publicada"')
          if markers != 31:
              errors.append(f'candidaturas/index.html: esperado 31 marcadores de fonte interna; encontrados {markers}')

          tse_label = 'TSE — pacote oficial de propostas presidenciais 2026 (contém os PDFs auditados de Lula e Flávio Bolsonaro)'
          for fn in ['apoio-lula/index.html', 'fundamentos/index.html']:
              text = Path(fn).read_text(encoding='utf-8')
              if text.count(tse_label) != 1:
                  errors.append(f'{fn}: rótulo unificado do TSE deveria aparecer 1 vez; aparece {text.count(tse_label)}')

          smoke_urls = [
              'https://www25.senado.leg.br/web/atividade/materias/-/materia/164766',
              'https://www.camara.leg.br/proposicoesWeb/prop_mostrarintegra?codteor=2887743',
              'https://www.camara.leg.br/proposicoesWeb/prop_mostrarintegra?codteor=2895874',
              'https://colaboragov.sei.gov.br/sei/controlador_externo.php?acao=documento_conferir&id_orgao_acesso_externo=0',
              'https://dadosabertos.tse.jus.br/dataset/candidatos-2026/resource/433ac1f4-07dc-44a2-bcbe-c87a2073721a',
          ]
          smoke = []
          for url in smoke_urls:
              try:
                  cp = subprocess.run(['curl', '-L', '-sS', '-A', 'Mozilla/5.0', '--max-time', '20', '-o', '/dev/null', '-w', '%{http_code}', url], text=True, capture_output=True, timeout=25)
                  code = cp.stdout.strip() or '000'
              except Exception:
                  code = '000'
              if code.isdigit() and 200 <= int(code) < 400:
                  status = 'PASS'
              elif code == '404':
                  status = 'FAIL'
                  errors.append(f'Smoke test 404: {url}')
              else:
                  status = 'WARN'
              smoke.append((status, code, url))

          total_links = sum(len(v.links) for v in parsed.values())
          unique_external = len(set(external))
          report = [
              '# QA de regressão — links do microsite #ChamaMaisATPS',
              '',
              '**Data:** 11/09/2026  ',
              '**Escopo:** somente links e destinos das quatro páginas públicas.',
              '',
              '## Resultado',
              '',
              f'- Links examinados: **{total_links}**',
              f'- Destinos externos únicos: **{unique_external}**',
              f'- Links internos com caminho conferidos: **{internal_checked}**',
              f'- Referências privadas convertidas em marcação de acervo interno: **{markers}**',
              f'- Erros: **{len(errors)}**',
              '',
              '## Correções verificadas',
              '',
              '- Exportação histórica do Chama+ATPS: links privados removidos; fonte mantida como acervo interno não publicado.',
              '- Registro interno da Comissão: links públicos removidos; referência mantida como registro interno.',
              '- PDF SEI 18001.001405/2026-68: link privado removido; referência documental preservada.',
              '- REQ 63/2024-CI: destino alterado para a página estável da matéria no Senado.',
              '- Conferência SEI de Renato Roseno: rótulo agora explicita que o destino é a tela de autenticação.',
              '- RIC 1297/2025 e RIC 1649/2025: parâmetros com espaços removidos das URLs de inteiro teor.',
              '- Quadro Lula × Flávio: par redundante de links para o mesmo pacote do TSE unificado em um único link.',
              '',
              '## Smoke test dos destinos alterados',
              '',
              '| Status | HTTP | Destino |',
              '|---|---:|---|',
          ]
          report += [f'| {status} | {code} | `{url}` |' for status, code, url in smoke]
          report += [
              '',
              '## Regras de regressão',
              '',
              '- Nenhum `href` contém espaço literal.',
              '- Todos os links `target="_blank"` mantêm `rel="noopener noreferrer"`.',
              '- Todos os links internos com caminho resolvem para arquivo/rota existente.',
              '- Nenhum dos três IDs privados do Drive permanece no código público de candidaturas.',
              '- O domínio antigo `legis.senado.gov.br` não permanece no código público.',
              '',
          ]
          if errors:
              report.append('## Falhas')
              report.extend(f'- {e}' for e in errors)
          else:
              report.append('**VEREDITO: PASS — nenhuma regressão de links detectada.**')

          Path('QA_LINKS_20260911.md').write_text('\n'.join(report) + '\n', encoding='utf-8')
          if errors:
              raise SystemExit('\n'.join(errors))
          PY

      - name: Regenerate release checksums
        run: |
          sha256sum index.html apoio-lula/index.html fundamentos/index.html candidaturas/index.html assets/styles.css README_RELEASE.md CHANGELOG.md QA_REPORT_FINAL.md > SHA256SUMS.txt

      - name: Commit fixes and QA report
        run: |
          git config user.name 'Nílian Silva'
          git config user.email 'niliancs@gmail.com'
          git add candidaturas/index.html apoio-lula/index.html fundamentos/index.html QA_LINKS_20260911.md SHA256SUMS.txt
          git commit -m 'Fix public evidence links and add link regression QA'
          git push origin main
